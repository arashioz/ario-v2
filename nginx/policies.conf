# Shared security + permissions headers.
# Include this line inside every `server { ... }` block (HTTP and HTTPS):
#     include /etc/nginx/policies.conf;
#
# IMPORTANT for the PWA: geolocation MUST stay enabled for this origin.
# The correct value is `geolocation=(self)`. NEVER write `geolocation=()` —
# an empty list disables GPS for the whole site, including the installed PWA.
# `Feature-Policy` is the legacy spelling kept for older iOS Safari / Edge;
# `Permissions-Policy` is the current standard read by Chrome and modern Safari.

add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), clipboard-read=(self), clipboard-write=(self)" always;
add_header Feature-Policy "geolocation 'self'; camera 'self'; microphone 'self'" always;

# Basic hardening. These do not affect geolocation. Referrer/ sniffing headers only.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# NOTE: HSTS (Strict-Transport-Security) is intentionally NOT here.
# It is only meaningful over HTTPS and is added in ariov2-ssl.conf.example.
# Adding it on plain HTTP does nothing and, with includeSubDomains, can lock
# you out of other services on the host, so it stays on the TLS server only.
