# Default site: answers any request that arrives by bare IP on port 80.
# No domain name is configured.
#
# NOTE: Browsers only allow geolocation in a SECURE CONTEXT. A plain http://<ip>
# origin is NOT a secure context (only https:// or http://localhost are), so GPS
# is blocked regardless of the Permissions-Policy header below. To make location
# work for the installed PWA you MUST serve the app over HTTPS: enable the TLS
# server in nginx/ariov2-ssl.conf.example and mount your certificates + expose 443.
# Everything here is kept working on HTTP so the stack still boots without certs.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 30m;

    # Let the page ask for location, camera and microphone. The prompt still
    # appears only from a tap inside the app. (Shared with the HTTPS server.)
    include /etc/nginx/policies.conf;

    # Docker's DNS. A variable in proxy_pass makes nginx re-resolve `app` after restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $upstream app:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell the app the real client scheme. Behind the TLS server below this is
        # "https"; on bare HTTP it stays "http". The backend uses it for callback URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}


