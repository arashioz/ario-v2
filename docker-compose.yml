# Every name below is prefixed "ariov2" so this stack never adopts or replaces containers/volumes of other
# apps on the same server (compose matches existing containers by project + service name).
name: ario-v2

services:
  mongodb:
    # 4.4 is the newest MongoDB that runs on CPUs without AVX (mongo:5+ exits with code 132 there).
    image: mongo:4.4
    container_name: ariov2_mongodb
    restart: always
    # Only reachable from the server itself (and the app over the compose network).
    ports:
      - "127.0.0.1:${MONGO_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_DATABASE: ario_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: ariov2-app:latest
    container_name: ariov2_app
    restart: always
    # Not published on the host. Traffic comes in through nginx on port 80.
    expose:
      - "3000"
    # Node 22 + Docker DNS: an IPv6 lookup of "mongodb" returns EAI_AGAIN and the app never listens.
    dns_opt:
      - ndots:0
    environment:
      PORT: 3000
      NODE_OPTIONS: --dns-result-order=ipv4first
      TZ: ${TZ:-Asia/Tehran}
      MONGODB_URI: mongodb://mongodb:27017/ario_db
      STATIC_DIR: /app/public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD in .env}
      ADMIN_DEFAULT_NAME: ${ADMIN_DEFAULT_NAME:-مدیر سیستم}
      MARKETER_DEFAULT_USERNAME: ${MARKETER_DEFAULT_USERNAME:-marketer}
      MARKETER_DEFAULT_PASSWORD: ${MARKETER_DEFAULT_PASSWORD:?Set MARKETER_DEFAULT_PASSWORD in .env}
      MARKETER_DEFAULT_NAME: ${MARKETER_DEFAULT_NAME:-بازاریاب آریو}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: ariov2_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  mongo_data:
    name: ariov2_mongo_data
  uploads:
    name: ariov2_uploads
  backups:
    name: ariov2_backups
