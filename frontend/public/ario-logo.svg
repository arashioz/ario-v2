<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="arioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#arioGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle inner wave / shine -->
  <path d="M64 120 C 180 80, 320 180, 448 130 L 448 400 C 350 450, 180 430, 64 400 Z" fill="white" fill-opacity="0.08" />

  <!-- Main Store / Shopping Bag / Shield Symbol -->
  <g transform="translate(136, 116)">
    <!-- Bag / Safe / Shop icon -->
    <rect x="20" y="70" width="200" height="190" rx="42" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="6" />
    
    <!-- Handle -->
    <path d="M70 70 V 46 C 70 20, 170 20, 170 46 V 70" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    
    <!-- Check / Star / Spark inside -->
    <path d="M90 165 L 110 185 L 155 135" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
