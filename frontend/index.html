<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="آریو" />
    <meta name="application-name" content="آریو" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>آریو</title>
    <style>
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #f8fafc; z-index: 9999;
      }
      #boot img { width: 84px; height: 84px; border-radius: 21px; box-shadow: 0 12px 30px -10px rgba(2,132,199,.45); }
      #boot i {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2.5px solid #bae6fd; border-top-color: #0284c7;
        animation: bootspin .8s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-slate-50 font-vazir text-slate-800 antialiased select-none">
    <div id="root">
      <div id="boot"><img src="/icons/icon-192.png" alt="" /><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
